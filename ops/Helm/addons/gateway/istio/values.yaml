base:
  enabled: true

istiod:
  enabled: true

  global:
    logAsJson: true

    istiod:
      enableAnalysis: true

  ## Discovery Settings
  pilot:
    traceSampling: 100.0

    env:
      ENABLE_NATIVE_SIDECARS: "true"
      ISTIO_ENABLE_CONTROLLER_QUEUE_METRICS: "true"
      PILOT_ENABLE_IP_AUTOALLOCATE: true
      ENABLE_INBOUND_RETRY_POLICY: true

  istio_cni:
    enabled: false

  # meshConfig defines runtime configuration of components, including Istiod and istio-agent behavior
  # See https://istio.io/docs/reference/config/istio.mesh.v1alpha1/ for all available options
  meshConfig:
    enableTracing: true
    enablePrometheusMerge: true
    # Both providers point at Grafana Alloy, our OTel collector: it resolves the
    # sending pod against the Kubernetes API and stamps the same k8s.* and
    # deployment.* resource attributes on mesh and application telemetry, so
    # Envoy spans and SDK spans land in Tempo under one identity scheme.
    #
    # Envoy's OpenTelemetry tracer speaks W3C trace context only, and go-sdk
    # registers TraceContext + Baggage (+ B3 on inject), so the incoming
    # traceparent is extracted and mesh spans become children of the
    # application trace. Do not add a zipkin tracer alongside this — two
    # tracers on one proxy is what splits a request into two trace trees.
    extensionProviders:
      - name: otel
        envoyOtelAls:
          service: grafana-alloy.grafana.svc.cluster.local
          port: 4317
      - name: otel-tracing
        opentelemetry:
          service: grafana-alloy.grafana.svc.cluster.local
          port: 4317

  telemetry:
    v2:
      metadataExchange:
        wasmEnabled: true
      prometheus:
        enabled: true
        wasmEnabled: true
