# Cluster-level resource attributes stamped onto every signal that passes
# through the collector. Rendered into files/config.alloy by Helm — Alloy
# itself does not expand ${VAR}, so these must not become env vars.
attributes:
  environment: production
  cluster: shortlink

alloy:
  alloy:
    fullnameOverride: grafana-alloy

    stabilityLevel: experimental

    serviceMonitor:
      enabled: true

      additionalLabels:
        release: prometheus-operator

    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
      - name: otlp-http
        port: 4318
        targetPort: 4318

    configMap:
      create: false
      name: alloy-config
      key: config.alloy

